apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels:
    app: alertmanager
    release: prometheus
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: log-only
      group_by: ['alertname', 'job', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: log-only
        - match:
            severity: warning
          receiver: log-only

    receivers:
      - name: log-only

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    app: alertmanager
    release: prometheus
spec:
  selector:
    app: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: 9093
