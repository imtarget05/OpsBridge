apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opsbridge-api-metrics
  labels:
    app: opsbridge-api
    release: prometheus
spec:
  selector:
    matchLabels:
      app: opsbridge-api
  namespaceSelector:
    matchNames:
      - opsbridge
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'dotnet.*|runtime.*|process.*|aspnetcore.*'
          action: drop
