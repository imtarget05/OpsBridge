apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flashsale

resources:
  - ../../base
  # The schema Job is run and awaited separately before this Deployment rolls.
  - ../../base/opsbridge-api
  - httproute.yaml

patches:
  - path: opsbridge-migration-exclude.yaml

replicas:
  - name: order-api
    count: 2
  - name: order-worker
    count: 1

images:
  - name: order-api
    newName: acrflashsalep6.azurecr.io/order-api
    newTag: e528d5a7503b4dd06a6646eb3f4b42ea23313d3e
  - name: order-worker
    newName: acrflashsalep6.azurecr.io/order-worker
    newTag: e528d5a7503b4dd06a6646eb3f4b42ea23313d3e
  - name: payment-service
    newName: acrflashsalep6.azurecr.io/payment-service
    newTag: e528d5a7503b4dd06a6646eb3f4b42ea23313d3e
  - name: opsbridge-api
    newName: acrflashsalep6.azurecr.io/opsbridge-api
    newTag: 3e7fb0d30dd2a5caffd3a7b9c73ec24367e11bf0

labels:
  - pairs:
      env: azure-cloud
